name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      # Start PostgreSQL to match your docker-compose.yml config
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: productivity_graveyard_dev
        ports:
          - 5432:5432
        # Ensure postgres is ready before starting the job
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Linting
        run: npm run lint

      - name: Run Tests
        env:
          # Match these to your .env.example / app setup
          DATABASE_URL: postgres://admin:secret@localhost:5432/productivity_graveyard_dev
          DATABASE_NAME: productivity_graveyard_dev
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: secret
          HOST: localhost
          DIALECT: postgres
          FORCE_SYNC: true
          # Other necessary vars
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'test_secret' }}
          NODE_ENV: test
        run: npm test
